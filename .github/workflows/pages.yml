name: Web app on GitHub Pages

# Publishes the web app (PWA) to https://<owner>.github.io/<repo>/ for testing on phones, e.g. adding
# it to an iPhone home screen. Independent of deploy.yml (the cPanel site); the app is built for the
# /<repo>/ sub-path here and for the site root there.
#
# One-time setup: Settings › Pages › Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Files/*.book'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # Apache settings mean nothing on Pages; don't publish them.
          rm -f dist/.htaccess

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
